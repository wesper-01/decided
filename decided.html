<style>
/* Layout: floating liquid-glass capsules (brand, tab bar, status) over a fixed colour-field backdrop;
   content sits in glass panels on a 1140px column; the tab bar docks to the bottom on phones.
   Icons: Lucide (ISC licence, lucide.dev), inlined. */
:root {
  --bg: #E8F1EB;
  --ink: #0E1A15;
  --muted: #4B5952;
  --faint: rgba(14,26,21,.06);
  --line: rgba(14,26,21,.10);
  --field: rgba(255,255,255,.60);
  --accent: #0B7F5C;
  --accent-2: #0B8078;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(11,127,92,.16);
  --prot: #E8385C;
  --carb: #C27606;
  --fat: #2F72EC;
  --good: #0C9A6A;
  --warn: #B86404;
  --bad: #D7264E;
  --cat-1: #E8385C; --cat-2: #2F72EC; --cat-3: #0C9A6A; --cat-4: #E08A07; --cat-5: #6FA712; --cat-6: #8B5CF6;
  --surface: rgba(250,253,251,.84);
  --lift: 0 1px 2px rgba(18,62,44,.07);
  --glass: rgba(255,255,255,.48);
  --glass-strong: rgba(255,255,255,.80);
  --rim-a: rgba(255,255,255,.95);
  --rim-b: rgba(255,255,255,.40);
  --rim-c: rgba(14,26,21,.06);
  --sheen: linear-gradient(168deg, rgba(255,255,255,.60) 0%, rgba(255,255,255,.10) 34%, rgba(255,255,255,0) 58%);
  --shadow: 0 20px 46px -22px rgba(18,62,44,.38), 0 3px 10px -4px rgba(18,62,44,.12);
  --shadow-sm: 0 8px 18px -10px rgba(18,62,44,.40);
  --blob-1: #BFE5D2; --blob-2: #EFE7D6; --blob-3: #C9E4E1; --blob-4: #F6F8F7; --blob-5: #A9DBC3;
  --grain: .45;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-xl: 28px; --r-lg: 22px; --r: 16px; --r-sm: 12px;
  --spring: cubic-bezier(.34, 1.45, .55, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06100C; --ink: #EAF3EE; --muted: #9AADA3; --faint: rgba(255,255,255,.06); --line: rgba(255,255,255,.11); --field: rgba(0,0,0,.26);
    --accent: #34D399; --accent-2: #2DD4BF; --accent-ink: #03140C; --accent-soft: rgba(52,211,153,.18);
    --prot: #FB7190; --carb: #FBBF3C; --fat: #6EA8FF; --good: #34D399; --warn: #FBBF3C; --bad: #FB7190;
    --cat-1: #FB7190; --cat-2: #6EA8FF; --cat-3: #34D399; --cat-4: #FBBF3C; --cat-5: #A3E635; --cat-6: #A78BFA;
    --surface: rgba(15,26,21,.84); --lift: 0 1px 2px rgba(0,0,0,.35);
    --glass: rgba(22,34,29,.46); --glass-strong: rgba(46,62,55,.78);
    --rim-a: rgba(255,255,255,.32); --rim-b: rgba(255,255,255,.09); --rim-c: rgba(0,0,0,.35);
    --sheen: linear-gradient(168deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.02) 34%, rgba(255,255,255,0) 58%);
    --shadow: 0 24px 52px -24px rgba(0,0,0,.8), 0 3px 10px -4px rgba(0,0,0,.45);
    --shadow-sm: 0 8px 18px -10px rgba(0,0,0,.7);
    --blob-1: #0B3D2D; --blob-2: #1E1A11; --blob-3: #0A2C28; --blob-4: #030806; --blob-5: #136B4D;
    --grain: .45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06100C; --ink: #EAF3EE; --muted: #9AADA3; --faint: rgba(255,255,255,.06); --line: rgba(255,255,255,.11); --field: rgba(0,0,0,.26);
  --accent: #34D399; --accent-2: #2DD4BF; --accent-ink: #03140C; --accent-soft: rgba(52,211,153,.18);
  --prot: #FB7190; --carb: #FBBF3C; --fat: #6EA8FF; --good: #34D399; --warn: #FBBF3C; --bad: #FB7190;
    --cat-1: #FB7190; --cat-2: #6EA8FF; --cat-3: #34D399; --cat-4: #FBBF3C; --cat-5: #A3E635; --cat-6: #A78BFA;
  --surface: rgba(15,26,21,.84); --lift: 0 1px 2px rgba(0,0,0,.35);
  --glass: rgba(22,34,29,.46); --glass-strong: rgba(46,62,55,.78);
  --rim-a: rgba(255,255,255,.32); --rim-b: rgba(255,255,255,.09); --rim-c: rgba(0,0,0,.35);
  --sheen: linear-gradient(168deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.02) 34%, rgba(255,255,255,0) 58%);
  --shadow: 0 24px 52px -24px rgba(0,0,0,.8), 0 3px 10px -4px rgba(0,0,0,.45);
  --shadow-sm: 0 8px 18px -10px rgba(0,0,0,.7);
  --blob-1: #0B3D2D; --blob-2: #1E1A11; --blob-3: #0A2C28; --blob-4: #030806; --blob-5: #136B4D;
  --grain: .45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; display: block; }

/* Backdrop: a slow emerald mist with one warm champagne note, under fine film grain. The grain stops banding
   in the soft gradients, and the glass blurs it away, so surfaces read smooth against a textured ground. */
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); pointer-events: none; }
.backdrop::after { content: ""; position: absolute; inset: 0; opacity: var(--grain); mix-blend-mode: overlay; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%271%200%200%200%200%201%200%200%200%200%201%200%200%200%200%200%200%200%200%201%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E"); background-size: 180px 180px; }
.blob { position: absolute; border-radius: 50%; opacity: .9; }
.b1 { width: 64vmax; height: 64vmax; left: -20vmax; top: -24vmax; background: radial-gradient(closest-side, var(--blob-1), transparent); animation: drift 26s ease-in-out infinite alternate; }
.b2 { width: 52vmax; height: 52vmax; right: -18vmax; top: -10vmax; background: radial-gradient(closest-side, var(--blob-2), transparent); animation: drift 32s ease-in-out -8s infinite alternate-reverse; }
.b3 { width: 58vmax; height: 58vmax; right: -12vmax; bottom: -28vmax; background: radial-gradient(closest-side, var(--blob-3), transparent); animation: drift 30s ease-in-out -4s infinite alternate; }
.b4 { width: 50vmax; height: 50vmax; left: -16vmax; bottom: -22vmax; background: radial-gradient(closest-side, var(--blob-4), transparent); animation: drift 36s ease-in-out -12s infinite alternate-reverse; }
.b5 { width: 36vmax; height: 36vmax; left: 34vw; top: 26vh; background: radial-gradient(closest-side, var(--blob-5), transparent); animation: drift 40s ease-in-out -20s infinite alternate; opacity: .65; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); } }

/* Surfaces: panels sit on the page as solid surfaces. Frosted glass (.frost) is kept for what floats above it:
   the tab bar, the Next up card and toasts. */
.glass { position: relative; background: var(--surface); border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--line), var(--lift); }
.frost {
  background: var(--sheen), var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--rim-a), inset 0 -1px 0 var(--rim-c), var(--shadow);
}
.frost::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, var(--rim-a), var(--rim-b) 20%, transparent 42%, transparent 64%, var(--rim-b) 86%, var(--rim-a));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .frost { background: var(--sheen), var(--glass-strong); } }
.panel { padding: 20px; border-radius: var(--r-xl); min-width: 0; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; padding-block: 12px 4px; }
/* Scroll-edge effect: content fades out as it slides under the header */
.top::before { content: ""; position: absolute; inset: 0 0 -22px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent) 40%, transparent);
  -webkit-mask: linear-gradient(180deg, #000 55%, transparent); mask: linear-gradient(180deg, #000 55%, transparent); }
.top-row { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; flex: none; }
.brand-mark { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%), linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 2px 6px -2px rgba(0,0,0,.25); }
.brand-mark .ic { width: 20px; height: 20px; stroke-width: 2.75; }
.brand-name { font-family: var(--font-display); font-weight: 750; font-size: 19px; letter-spacing: -0.035em; white-space: nowrap; }
.brand-name .dot { color: var(--accent); }
.tabbar { display: flex; gap: 2px; padding: 5px; border-radius: 999px; margin-inline: auto; }
.tab { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-radius: 999px; background: none; color: var(--muted); font: 650 14px var(--font-body); cursor: pointer; white-space: nowrap; transition: color .3s; }
.tab:hover, .tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .ic { color: var(--accent); }
.tab-thumb { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px; background: var(--sheen), var(--glass-strong); box-shadow: inset 0 1px 0 var(--rim-a), inset 0 -1px 0 var(--rim-c), 0 6px 16px -6px rgba(0,0,0,.28); }
.tabbar.ready .tab-thumb { transition: transform .6s var(--spring), width .6s var(--spring); }
.top-meta { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; flex: none; font-size: 13px; font-weight: 650; }
.goal-txt { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal-txt .ic { width: 16px; height: 16px; color: var(--carb); }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--faint); color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
.sync .ic { width: 15px; height: 15px; }
.sync[data-s="db"] { color: var(--good); }
.sync[data-s="error"] { color: var(--bad); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 1060px) { .brand-name, .sync span { display: none; } .brand { padding: 6px; } }
main.wrap { padding-block: 10px 80px; }
@media (max-width: 720px) {
  .top-row { justify-content: space-between; }
  .brand-name { display: inline; }
  .brand { padding: 5px 14px 5px 5px; }
  .tabbar { position: fixed; z-index: 40; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 440px; justify-content: space-between; padding: 6px; }
  .tab { flex: 1 1 0; flex-direction: column; gap: 3px; padding: 7px 2px; font-size: 10.5px; min-width: 0; }
  .tab .ic { width: 21px; height: 21px; }
  .tab-thumb { top: 6px; bottom: 6px; }
  .goal-txt span { display: none; }
  .top-meta { padding: 5px; }
  main.wrap { padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
}

/* Type */
.h1 { font-family: var(--font-display); font-weight: 750; font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.035em; line-height: 1.02; margin: 2px 0 0; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; line-height: 1.2; margin: 0; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 650; }
.bignum { font-family: var(--font-display); font-weight: 750; font-size: 44px; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.bignum .u { font-family: var(--font-body); font-size: 14px; font-weight: 650; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin: 14px 0 18px; }
.page-head .right, .sec-head .right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head .right { margin-left: auto; }
.count { font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 3px 10px; border-radius: 999px; background: var(--faint); }

/* Controls */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 8px 16px; border: 0; border-radius: var(--r-sm); color: var(--ink); font: 650 14px/1.1 var(--font-body); cursor: pointer; white-space: nowrap; text-decoration: none;
  background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line);
  transition: transform .25s var(--spring), box-shadow .2s, filter .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.96); }
.btn .ic { width: 17px; height: 17px; }
/* The primary action is the one pill, the one gradient and the one glow on a screen. */
.btn.primary { border-radius: 999px; color: var(--accent-ink); background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,0) 52%), linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.08), 0 10px 22px -10px var(--accent); }
.btn.primary:hover { filter: brightness(1.05) saturate(1.1); }
.btn.sm { min-height: 36px; padding: 6px 13px; font-size: 13px; }
.btn.icon { width: 44px; padding: 0; }
.btn.icon.sm { width: 36px; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn.ghost:hover { background: var(--faint); color: var(--ink); }
.btn.big { min-height: 52px; font-size: 16px; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="number"], input[type="date"], input:not([type]) {
  font: 500 15px var(--font-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; min-height: 44px; width: 100%; min-width: 0;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.05); transition: border-color .2s, box-shadow .2s; }
input:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px var(--accent-soft); }
input:disabled { opacity: .6; }
input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
.withic { position: relative; display: block; min-width: 0; }
.withic > .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.withic input { padding-left: 40px; }
.unitbox { position: relative; display: block; min-width: 0; }
.unitbox > span { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 650; font-size: 13px; pointer-events: none; }
.unitbox input { padding-right: 40px; }
.pair { display: flex; gap: 8px; }
.lab { font-size: 13px; font-weight: 700; color: var(--muted); }
.field { display: grid; gap: 7px; min-width: 0; align-content: start; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }

/* Round check */
.tick { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin: 0; border-radius: 50%; flex: none; cursor: pointer; display: grid; place-items: center;
  border: 2px solid color-mix(in srgb, var(--muted) 45%, transparent); background: var(--field); transition: transform .3s var(--spring), background .2s, border-color .2s; }
.tick:hover { border-color: var(--accent); }
.tick:active { transform: scale(.88); }
.tick:checked { border-color: transparent; background: var(--accent); }
.tick:checked::after { content: ""; width: 11px; height: 6px; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: translateY(-1.5px) rotate(-45deg); }
.tick.sm { width: 22px; height: 22px; }
.tick.sm:checked::after { width: 9px; height: 5px; border-width: 0 0 2px 2px; }

/* Segmented controls and chips */
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 4px; border-radius: 16px; background: var(--faint); box-shadow: inset 0 1px 2px rgba(0,0,0,.06); justify-self: start; max-width: 100%; }
.seg label, .chips label, .opt { position: relative; }
.seg input, .chips input, .opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 13px; border-radius: 12px; font-weight: 650; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; transition: background .25s, color .25s, box-shadow .25s; }
.seg span:hover { color: var(--ink); }
.seg input:checked + span { color: var(--ink); background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 13px; border-radius: 10px; font-weight: 650; font-size: 13.5px; cursor: pointer; background: var(--field); border: 1px solid var(--line); transition: all .25s; }
.chips span .ic { width: 15px; height: 15px; display: none; }
.chips input:checked + span { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: color-mix(in srgb, var(--bad) 80%, var(--ink)); }
.chips input:checked + span .ic { display: block; }
.seg input:focus-visible + span, .chips input:focus-visible + span, .opt input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.opt > span { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 12px; align-items: center; height: 100%; padding: 12px 14px; border-radius: var(--r); background: var(--field); border: 1px solid var(--line); cursor: pointer; transition: transform .3s var(--spring), border-color .2s, box-shadow .2s, background .2s; }
.opt > span:hover { transform: translateY(-1px); }
.opt .bub { grid-row: span 2; width: 38px; height: 38px; border-radius: 12px; }
.opt b { font-weight: 750; font-size: 14.5px; }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.opt input:checked + span { background: var(--glass-strong); border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* Bubbles and macro chips */
.bub { --c: var(--muted); width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; color: color-mix(in srgb, var(--c) 82%, var(--ink)); background: color-mix(in srgb, var(--c) 17%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px color-mix(in srgb, var(--c) 18%, transparent); }
.bub .ic { width: 20px; height: 20px; }
.bub.grad { color: var(--accent-ink); background: var(--accent); box-shadow: none; }
.bub.sm { width: 30px; height: 30px; border-radius: 10px; }
.bub.sm .ic { width: 16px; height: 16px; }
.mchips { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------------- Recipes ----------------
   Item: "<group> <food|food:base> <base>"  groups: P protein, C carbs, F fat (scaled to hit macros),
   X fixed extra (scaled with meal size), V vegetables. "~" picks a random allowed option, "?" optional. */
const RECIPES = [];
function R(id, name, slots, time, items, steps) {
  RECIPES.push({ id, name, slots: slots.split(' '), time, steps, items: items.map(s => {
    const [gt, ot, bt] = s.split(' ');
    return { g: gt.replace(/[~?]/g, ''), vary: gt.includes('~'), optional: gt.includes('?'),
      opts: ot.split('|').map(o => { const [fid, b] = o.split(':'); return { id: fid, base: +(b || bt) }; }) };
  }) });
}

// The week's plan as plain text, to paste into notes or send to someone.

/* ---------------- Groceries ---------------- */
const buyInfo = id => { const b = BUY[id] || [1, 5]; return { mult: b[0], price: b[1], name: b[2] || FOOD[id].name }; };
// Your own price wins, then Claude's estimate for your city, then the default scaled to your country and area.
function priceOf(id) {
  const own = state.prefs.prices?.[id], city = state.prefs.cityPrices?.[id];
  if (own != null) return { v: own, own: true };
  if (city != null) return { v: city, own: false, city: true };
  return { v: Math.round(buyInfo(id).price * (state.prefs.priceScale || 1) * 100) / 100, own: false };
}
function money(v, whole) {
  const cur = state.prefs.currency || '$', n = whole || Math.abs(v) >= 100 ? fmt(v) : v.toFixed(2);
  const after = state.prefs.curPos ? state.prefs.curPos === 'after' : cur.length > 1;
  return after ? `${n} ${cur}` : `${cur}${/[A-Za-z]$/.test(cur) ? ' ' : ''}${n}`;
}
const mealCost = m => (m?.items || []).reduce((s, i) => s + i.q * buyInfo(i.f).mult / 1000 * priceOf(i.f).v, 0);

let floorMemo = { key: '', v: 0 }, scratch = false;
function cheapestWeek() {

  scratch = true; state.days = {}; state.prefs = { ...p, budget: 0.01, budgetPeriod: 'day', budgetFit: true };

  finally { scratch = false; state.days = real.days; state.prefs = real.prefs; }

}

}
const periodLen = p => p === 'month' ? 30 : 7;
const periodKeys = p => Array.from({ length: periodLen(p) }, (_, n) => addDays(TODAY(), n));
const chartW = () => clamp(innerWidth - 90, 300, 640);
function groceryStats(period) {

    const d = state.days[k], day = { k, cost: 0, planned: !!d?.plan?.some(Boolean) };
    if (day.planned) d.plan.forEach(m => {
      if (!m) return;

      m.items.forEach(i => {

function buyAmount(id, g) {

async function estimateCityPrices() {

  if (g.priceBusy || !ui.sample) return;
  if (!city && !c) return toast('Pick a country or type a city first.');
  const where = [city, c?.name].filter(Boolean).join(', ');
  g.priceBusy = true; g.priceErr = ''; g.priceCtl = new AbortController(); render();
  try {
    const prompt = [
      `Estimate typical supermarket prices in ${where} right now, at a mid-range supermarket.`,
      `Currency: ${c ? `${c.iso} (${c.sym})` : p.currency || '$'}. Give each price per kg (per litre for drinks and oils) as a plain number in that currency.`,
      'Prices are for the form named: raw meat and fish, dry rice, pasta and grains, canned beans. Eggs per kg (about 20 eggs).',
      '',
      'Items (id | name | unit):',
      FOODS.map(f => `${f.id} | ${buyInfo(f.id).name} | ${f.ml ? 'litre' : 'kg'}`).join('\n'),
      '',
      'Reply with only a JSON object mapping every id to its price, like {"chicken_breast": 92.5, "white_rice": 14}.',
    ].join('\n');
    const out = await ui.sample.json(prompt, { signal: g.priceCtl.signal, cache: false });
    if (!out || typeof out !== 'object') throw { code: 'bad_meal' };
    const got = {};
    for (const f of FOODS) {
      const v = Number(out[f.id]); if (!(v > 0 && v < 1e8)) continue;
      // Ignore answers wildly off the country's level (a unit mix-up, usually).
      const expect = buyInfo(f.id).price * (c ? c.f : p.priceScale || 1);
      if (c && (v < expect * 0.2 || v > expect * 5)) continue;
      got[f.id] = Math.round(v * 100) / 100;
    }
    if (Object.keys(got).length < FOODS.length * 0.6) throw { code: 'bad_prices' };
    Object.assign(p, { cityPrices: got, cityPricesFor: where, cityPricesAt: TODAY() });
    save('profile');
    toast(`Prices updated for ${where}: ${Object.keys(got).length} of ${FOODS.length} foods.`);
  } catch (e) {
    g.priceErr = e?.code === 'cancelled' ? '' : e?.code === 'bad_prices' ? "Claude's prices looked off for too many foods, so nothing changed. Try again." : aiErr(e);
  }
  g.priceBusy = false; render();
}

  water: b => { const d = getDay(b.dataset.k); d.water = clamp((d.water || 0) + +b.dataset.d, 0, 8000); save('day-' + b.dataset.k); render(); },

  block: b => {

  grocery: () => setTab('groceries'),

  swap: b => {

  'use-tdee': b => { state.profile.tdeeOverride = +b.dataset.v; save('profile'); render(); toast('Targets now use your measured maintenance.'); },

  'dislike-add': () => addDislike(),
  'dislike-del': b => { readSetup(); ui.draft.prefs.dislikes = ui.draft.prefs.dislikes.filter(x => x !== b.dataset.id); render(); },

};
const FORMS = {

    const food = findFood($('#af-food').value), q = num($('#af-grams').value);
    if (!food) return toast('Pick a food from the list, or use “Add something not in the list”.');
    if (!(q > 0 && q < 5000)) return toast('Enter an amount in grams.');
    const t = itemsTotals([{ f: food.id, q }]), r1 = x => Math.round(x * 10) / 10;
    getDay(ui.todayKey).log.push({ id: newId(), name: food.name, food: food.id, q, kcal: r0(t.kcal), p: r1(t.p), c: r1(t.c), f: r1(t.f) });
    save('day-' + ui.todayKey); render(); toast(`Added ${food.name}.`); $('#af-food')?.focus();
  },
  addCustom: () => {
    const name = $('#cu-name').value.trim(), k = num($('#cu-k').value);
    if (!name || !(k >= 0)) return toast('Give it a name and a calorie count.');
    getDay(ui.todayKey).log.push({ id: newId(), name: name.slice(0, 80), kcal: k, p: num($('#cu-p').value) || 0, c: num($('#cu-c').value) || 0, f: num($('#cu-f').value) || 0 });
    save('day-' + ui.todayKey); render(); toast(`Added ${name}.`);
  },
  aiToday: () => runTodayAI(),
  ask: f => runAsk(f.dataset.k, +f.dataset.i),
  weight: () => {
    const k = $('#w-date').value || TODAY(), v = num($('#w-val').value);
    if (!(v > 0)) return toast('Enter your weight first.');
    const kg = state.profile.units === 'imperial' ? v / 2.20462 : v;
    if (kg < 30 || kg > 300) return toast('That weight looks off. Check the number and the unit.');
    state.weights[k] = Math.round(kg * 100) / 100; save('weights');
    if (!state.profile.example && k === Object.keys(state.weights).sort().at(-1)) { state.profile.weightKg = state.weights[k]; save('profile'); }
    render(); toast('Weigh-in saved.');
  },
  setupForm: () => { if (document.activeElement?.id === 'f-dislike') addDislike(); else saveSetup(); },
  price: f => {
    const v = num($('#price-in').value);

    (state.prefs.prices ||= {})[f.dataset.id] = Math.round(v * 100) / 100; save('profile');

document.addEventListener('click', e => {

  ACTIONS[b.dataset.act]?.(b, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'restore-file' && el.files[0]) {
    // A chosen file only fills the box; "Replace my data with this backup" still asks before anything changes.
    el.files[0].text().then(t => { $('#restore-in').value = t; $('#restore-err').textContent = parseBackup(t).err || ''; });
  } else if (el.dataset?.act === 'eat') {
    const d = getDay(el.dataset.k); d.eaten[+el.dataset.i] = el.checked; save('day-' + el.dataset.k); render();
  } else if (el.dataset?.act === 'tick') {
    const ticks = readTicks(ui.groc.period); if (el.checked) ticks[el.dataset.id] = 1; else delete ticks[el.dataset.id];
    writeTicks(ui.groc.period, ticks); render();
  } else if (el.closest('#grocBudget')) {
    applyBudget(el);
  } else if (el.closest('#grocWhere')) {
    applyWhere(el);
  } else if (el.closest('#qsForm')) {
    const q = ui.qs, wasImp = q.units === 'imperial';
    readQs();
    if (el.name === 'goal' && ui.qsTap) { q.err = ''; q.step = 2; render(); window.scrollTo(0, 0); }
    else if (el.name === 'units' && wasImp !== (q.units === 'imperial')) {
      // Carry the numbers over so 82.5 kg doesn't quietly become 82.5 lb.
      const p = qsProfile({ ...q, units: wasImp ? 'imperial' : 'metric' }), f1 = x => Number.isFinite(x) && x > 0 ? String(Math.round(x * 10) / 10) : '';
      if (q.units === 'imperial') { const inch = Math.round(p.heightCm / 2.54); q.w = f1(p.weightKg * 2.20462); q.ft = inch > 0 ? String(Math.floor(inch / 12)) : ''; q.inch = inch > 0 ? String(inch % 12) : ''; }
      else { q.w = f1(p.weightKg); q.h = p.heightCm > 0 ? String(Math.round(p.heightCm)) : ''; }
      render();
    }
  } else if (el.closest('#setupForm') && el.id !== 'f-dislike') {
    readSetup();
    if (el.name === 'units') render(); else updateSetupAside();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'af-food' || el.id === 'af-grams') updatePreview();
  else if (el.id === 'ask-in' && ui.ask) ui.ask.craving = el.value;
  else if (el.id === 'ai-today-in') ui.todayAI.craving = el.value;
  else if (el.closest('#setupForm') && el.type === 'number') { readSetup(); updateSetupAside(); }

document.addEventListener('submit', e => {

});
document.addEventListener('pointerdown', e => { ui.qsTap = !!e.target.closest?.('#qsForm .opt'); }, true);
document.addEventListener('keydown', () => { ui.qsTap = false; }, true);
// Escape closes the open inline panel and puts focus back on the button that opened it.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  let back;
  if (ui.swap) { back = `[data-act="swap"][data-k="${ui.swap.k}"][data-i="${ui.swap.i}"]`; ui.swap = null; }

window.addEventListener('resize', moveThumb);

/* ---------------- Live background ----------------
   A WebGL shader that swirls the theme's colour fields together, drifts slowly with time
   and shifts as you scroll. Renders at a third of screen resolution (the gradients are soft, so it
   upscales cleanly) and at most 30 fps; pauses in hidden tabs; draws one still frame for reduced motion.
   Without WebGL the CSS colour blobs stay as the fallback. */
function liveBackdrop() {
  const cv = document.createElement('canvas');
  let gl = null;
  try { gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' }); } catch {}
  if (!gl) return;
  const frag = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uTime; uniform float uScroll;
uniform vec3 uBg, uC1, uC2, uC3, uC4, uC5;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
void main() {
  float s = min(uRes.x, uRes.y);
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / s * 1.7;
  p.y -= uScroll * 0.45;
  float t = uTime * 0.045;
  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 2.4 * q + vec2(1.7, 9.2) + 0.7 * t), fbm(p + 2.4 * q + vec2(8.3, 2.8) - 0.6 * t));
  vec2 m = vec2(0.22, 0.12) * uRes / s * 1.7; // a fixed soft light, upper right
  m.y -= uScroll * 0.45;
  float glow = exp(-1.8 * dot(p - m, p - m));
  vec3 col = uBg;
  col = mix(col, uC1, smoothstep(0.30, 0.75, r.x));
  col = mix(col, uC2, smoothstep(0.38, 0.80, q.y) * 0.9);
  col = mix(col, uC3, smoothstep(0.42, 0.85, r.y) * 0.9);
  col = mix(col, uC4, smoothstep(0.48, 0.88, fbm(p * 1.3 + r * 1.6 - t)) * 0.85);
  col = mix(col, uC5, glow * 0.4);
  gl_FragColor = vec4(col, 1.0);
}`;
  const shader = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
  const vs = shader(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }'), fs = shader(gl.FRAGMENT_SHADER, frag);
  if (!vs || !fs) return;
  const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { res: U('uRes'), time: U('uTime'), scroll: U('uScroll'), bg: U('uBg'), c: [1, 2, 3, 4, 5].map(i => U('uC' + i)) };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const rgb = s => { s = s.trim().replace('#', ''); if (s.length === 3) s = s.replace(/./g, x => x + x); const n = parseInt(s, 16) || 0; return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  const t0 = performance.now();
  let last = 0;
  function draw(now = performance.now()) {
    gl.uniform1f(u.time, reduce.matches ? 40 : 40 + (now - t0) / 1000);
    gl.uniform1f(u.scroll, scrollY / Math.max(1, innerHeight));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function palette() {
    const cs = getComputedStyle(document.documentElement);
    gl.uniform3fv(u.bg, rgb(cs.getPropertyValue('--bg')));
    u.c.forEach((l, i) => gl.uniform3fv(l, rgb(cs.getPropertyValue('--blob-' + (i + 1)))));
    draw();
  }
  function size() {
    cv.width = Math.max(48, Math.round(innerWidth / 3)); cv.height = Math.max(48, Math.round(innerHeight / 3));
    gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(u.res, cv.width, cv.height); draw();
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden || reduce.matches || now - last < 33) return;
    last = now; draw(now);
  }
  cv.className = 'live'; cv.setAttribute('aria-hidden', 'true');
  $('.backdrop').prepend(cv); document.documentElement.classList.add('live-bg');
  size(); palette(); requestAnimationFrame(loop);
  addEventListener('resize', size);
  addEventListener('scroll', () => { if (reduce.matches) draw(); }, { passive: true });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', palette);
  new MutationObserver(palette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  cv.addEventListener('webglcontextlost', () => { document.documentElement.classList.remove('live-bg'); cv.remove(); });
}

{ const h = location.hash.slice(1); if (TABS.includes(h)) ui.tab = h; }
